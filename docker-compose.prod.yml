# Production docker-compose.yml
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - waste_network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=waste_db
      - POSTGRES_USER=waste_user
      - POSTGRES_PASSWORD=waste_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waste_user -d waste_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - waste_network

  osrm-foot:
    image: osrm/osrm-backend:latest
    volumes:
      - ./osrm-data/foot:/data
    command: "osrm-routed --algorithm mld /data/innopolis.osrm"
    restart: unless-stopped
    networks:
      - waste_network

  osrm-driving:
    image: osrm/osrm-backend:latest
    volumes:
      - ./osrm-data/driving:/data
    command: "osrm-routed --algorithm mld /data/innopolis.osrm"
    restart: unless-stopped
    networks:
      - waste_network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"     # Стандартный HTTP порт
      - "443:443"   # Стандартный HTTPS порт
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./frontend:/usr/share/nginx/html
      - /etc/letsencrypt:/etc/letsencrypt:ro  # Прокидываем SSL сертификаты с сервера в Docker
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - waste_network

volumes:
  postgres_data:

networks:
  waste_network:
    driver: bridge