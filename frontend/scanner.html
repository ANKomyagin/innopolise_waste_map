{% extends "base.html" %}

{% block title %}Сканер QR-кода{% endblock %}

{% block header_actions %}
<button onclick="window.location.href='/resident.html'" class="bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-white font-medium py-1.5 px-3 rounded-lg text-sm transition-colors flex items-center gap-2">
    <i class="fas fa-map"></i> Карта
</button>
{% endblock %}

{% block layout %}
<div class="flex-1 pt-20 bg-gray-50 dark:bg-gray-900 dark:text-white min-h-screen flex flex-col items-center p-4 z-20 relative">
    <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden mt-4 relative">
        <!-- Close Button -->
        <button onclick="window.history.back()" class="absolute top-4 right-4 text-white hover:text-gray-200 z-10 w-8 h-8 flex items-center justify-center rounded-full bg-black/20 hover:bg-black/40 transition-colors">
            <i class="fas fa-times text-xl"></i>
        </button>

        <div class="bg-green-600 p-6 text-center text-white">
            <i class="fas fa-qrcode text-4xl mb-2"></i>
            <h1 class="text-2xl font-bold">Сканер QRBIN</h1>
            <p class="text-green-100 text-sm mt-1">Наведите камеру на QR-код площадки</p>
        </div>
        
        <div class="p-6 flex flex-col items-center">
            <div id="reader" class="w-full rounded-lg overflow-hidden border-2 border-gray-200 dark:border-gray-700 bg-black relative"></div>
            
            <!-- Camera Controls -->
            <div id="cameraControls" class="w-full mt-4 flex flex-col gap-4 hidden">
                <div class="flex items-center justify-between bg-gray-100 dark:bg-gray-700 p-3 rounded-xl">
                    <span class="text-sm font-medium text-gray-700 dark:text-gray-300"><i class="fas fa-search-plus mr-2"></i>Зум</span>
                    <input type="range" id="zoomSlider" min="1" max="5" step="0.1" value="1" class="w-1/2 accent-green-600">
                </div>
                <button id="torchBtn" class="w-full bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-white font-medium py-3 rounded-xl transition-colors flex items-center justify-center gap-2">
                    <i class="fas fa-bolt"></i> Включить фонарик
                </button>
            </div>

            <div id="scanResult" class="hidden w-full mt-6 p-4 rounded-xl text-center font-medium"></div>
            
            <button id="restartBtn" onclick="startScanner()" class="hidden w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all flex items-center justify-center gap-2">
                <i class="fas fa-redo"></i> Сканировать заново
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/vendor/js/html5-qrcode.min.js"></script>
<script>
    let html5QrCode = null;
    let currentStream = null;
    let track = null;
    let isTorchOn = false;

    function onScanSuccess(decodedText, decodedResult) {
        // Остановка сканера
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                html5QrCode.clear();
                document.getElementById('cameraControls').classList.add('hidden');
            }).catch(err => console.error("Failed to stop scanner", err));
        }
        
        const resultDiv = document.getElementById('scanResult');
        const restartBtn = document.getElementById('restartBtn');
        
        resultDiv.classList.remove('hidden', 'bg-red-100', 'text-red-800', 'bg-green-100', 'text-green-800');
        restartBtn.classList.remove('hidden');
        
        try {
            const url = new URL(decodedText);
            const currentHostname = window.location.hostname;
            const allowedHostnames = ['qrbin.ru', 'www.qrbin.ru', currentHostname];
            
            // Проверка безопасности (защита от квишинга)
            if (allowedHostnames.includes(url.hostname) && url.pathname === '/qr-scan') {
                resultDiv.classList.add('bg-green-100', 'text-green-800');
                resultDiv.innerHTML = '<i class="fas fa-check-circle text-2xl mb-2 block"></i>Код распознан! Перенаправление...';
                
                // Перенаправляем на страницу сканирования
                setTimeout(() => {
                    window.location.href = decodedText;
                }, 1000);
            } else {
                resultDiv.classList.add('bg-red-100', 'text-red-800');
                resultDiv.innerHTML = '<i class="fas fa-exclamation-triangle text-2xl mb-2 block"></i>Внимание! Этот QR-код не принадлежит системе QRBIN. Возможна попытка фишинга.';
            }
        } catch (e) {
            resultDiv.classList.add('bg-red-100', 'text-red-800');
            resultDiv.innerHTML = '<i class="fas fa-exclamation-triangle text-2xl mb-2 block"></i>Неверный формат QR-кода.';
        }
    }

    function onScanFailure(error) {
        // Игнорируем ошибки сканирования (кадр без QR-кода)
    }

    function setupCameraControls() {
        // Получаем доступ к видео-треку
        const videoElement = document.querySelector('#reader video');
        if (!videoElement || !videoElement.srcObject) return;
        
        const stream = videoElement.srcObject;
        track = stream.getVideoTracks()[0];
        
        if (!track) return;

        const capabilities = track.getCapabilities();
        const controlsDiv = document.getElementById('cameraControls');
        const zoomSlider = document.getElementById('zoomSlider');
        const torchBtn = document.getElementById('torchBtn');

        let showControls = false;

        // Настройка зума
        if (capabilities.zoom) {
            zoomSlider.min = capabilities.zoom.min;
            zoomSlider.max = capabilities.zoom.max;
            zoomSlider.step = capabilities.zoom.step || 0.1;
            zoomSlider.value = track.getSettings().zoom || 1;
            
            zoomSlider.addEventListener('input', (e) => {
                track.applyConstraints({ advanced: [{ zoom: parseFloat(e.target.value) }] });
            });
            showControls = true;
        } else {
            zoomSlider.parentElement.style.display = 'none';
        }

        // Настройка фонарика
        if (capabilities.torch) {
            torchBtn.addEventListener('click', async () => {
                try {
                    isTorchOn = !isTorchOn;
                    await track.applyConstraints({ advanced: [{ torch: isTorchOn }] });
                    if (isTorchOn) {
                        torchBtn.innerHTML = '<i class="fas fa-bolt text-yellow-500"></i> Выключить фонарик';
                    } else {
                        torchBtn.innerHTML = '<i class="fas fa-bolt"></i> Включить фонарик';
                    }
                } catch (err) {
                    console.error("Torch error:", err);
                }
            });
            showControls = true;
        } else {
            torchBtn.style.display = 'none';
        }

        if (showControls) {
            controlsDiv.classList.remove('hidden');
        }
    }

    function startScanner() {
        document.getElementById('scanResult').classList.add('hidden');
        document.getElementById('restartBtn').classList.add('hidden');
        isTorchOn = false;
        
        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("reader");
        }
        
        html5QrCode.start(
            { facingMode: "environment" }, // Задняя камера по умолчанию
            {
                fps: 10,
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0
            },
            onScanSuccess,
            onScanFailure
        ).then(() => {
            // Небольшая задержка, чтобы видео-элемент успел инициализироваться
            setTimeout(setupCameraControls, 500);
        }).catch((err) => {
            const resultDiv = document.getElementById('scanResult');
            resultDiv.classList.remove('hidden');
            resultDiv.classList.add('bg-red-100', 'text-red-800');
            resultDiv.innerHTML = '<i class="fas fa-camera text-2xl mb-2 block"></i>Ошибка доступа к камере. Пожалуйста, разрешите использование камеры в настройках браузера.';
            document.getElementById('restartBtn').classList.remove('hidden');
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        startScanner();
    });
</script>
{% endblock %}
